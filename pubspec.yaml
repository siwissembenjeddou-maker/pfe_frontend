name: autism_assessment_app
description: AutoSense - Autism Assessment Application for Children
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP requests
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^1.2.0

  # Audio recording
  record: ^6.2.0

  # File picker
  file_picker: ^11.0.2

  # Permissions
  permission_handler: ^12.0.1

  # Image picker
  image_picker: ^1.1.2

  # Icons fix (IMPORTANT)
  font_awesome_flutter: ^11.0.0

  # Optional SVG support (safe to keep)
  flutter_svg: ^2.0.10+1

  # Default iOS icons
  cupertino_icons: ^1.0.6

  # Utils
  intl: ^0.20.2
  table_calendar: ^3.1.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          style: normal
          weight: 700
