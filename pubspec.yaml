name: autism_assessment_app
description: AutoSense - Autism Assessment Application for Children
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP requests
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^0.67.0

  # Audio recording
  record: ^5.1.0

  # File picker
  file_picker: ^8.0.3

  # Permissions
  permission_handler: ^11.3.1

  # Image picker
  image_picker: ^1.1.2

  # Icons fix (IMPORTANT)
  font_awesome_flutter: ^10.7.0

  # Optional SVG support (safe to keep)
  flutter_svg: ^2.0.10+1

  # Default iOS icons
  cupertino_icons: ^1.0.6

  # Utils
  intl: ^0.19.0
  table_calendar: ^3.1.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # IMPORTANT: uncomment ONLY if you actually use assets
  # assets:
  #   - assets/icons/
  #   - assets/images/

  # IMPORTANT: uncomment ONLY if you use custom fonts
  # fonts:
  #   - family: AppIcons
  #     fonts:
  #       - asset: assets/fonts/AppIcons.ttf